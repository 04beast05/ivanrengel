<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ivan Rengel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@700&family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --font: 'Open Sans Condensed', 'Open Sans', Arial Narrow, sans-serif; }

    body { background: #fff; color: #111; font-family: var(--font); overflow-x: hidden; }

    /* ── LOADER ── */
    #loader {
      position: fixed; inset: 0; background: #000; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.7s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .loader-logo {
      font-family: var(--font); font-weight: 800;
      font-size: clamp(2rem, 6vw, 5rem); color: #fff;
      letter-spacing: 0.08em; text-transform: uppercase;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── PAGE ── */
    .page { max-width: 1100px; margin: 0 auto; padding: 60px 48px 0; }

    .top-row { margin-bottom: 10px; }
    .back-link {
      font-family: var(--font); font-weight: 800; font-size: 0.82rem;
      letter-spacing: 0.12em; text-transform: uppercase; color: #111;
      text-decoration: none; display: inline-block;
    }
    .back-link:hover { opacity: 0.4; }

    .filter-block { text-align: center; margin-bottom: 48px; }
    .filter-label {
      font-family: 'Open Sans', sans-serif; font-weight: 400;
      font-size: 0.78rem; color: #111; margin-bottom: 6px; letter-spacing: 0.02em;
    }
    .sep { font-family: var(--font); font-weight: 800; font-size: clamp(0.95rem,1.4vw,1.15rem); color: #111; }
    .filter-btn {
      background: none; border: none; font-family: var(--font); font-weight: 800;
      font-size: clamp(0.95rem,1.4vw,1.15rem); letter-spacing: 0.01em;
      color: #bbb; cursor: pointer; padding: 0; transition: color 0.15s; display: inline;
    }
    .filter-btn:hover { color: #111; }
    .filter-btn.active { color: #111; }

    /* ── WORK GRID ── */
    .work-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 36px 28px;
      margin-bottom: 80px;
    }
    .work-item { cursor: pointer; }
    .work-item.hidden { display: none; }

    /* THUMBNAIL — fixed ratio, image always fills and crops to fit */
    .work-thumb {
      width: 100%;
      aspect-ratio: 3 / 2;        /* sve kartice isti omjer */
      background: #e8e8e8;
      overflow: hidden;
      margin-bottom: 10px;
      position: relative;
    }
    .work-thumb img,
    .work-thumb video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;          /* uvijek popunjava, nikad bijeli rubovi */
      object-position: center;
      display: block;
      transition: transform 0.4s ease;
    }
    .work-item:hover .work-thumb img,
    .work-item:hover .work-thumb video { transform: scale(1.04); }

    .work-meta { display: flex; align-items: baseline; gap: 9px; }
    .work-num {
      font-family: var(--font); font-weight: 800; font-size: 0.72rem;
      letter-spacing: 0.06em; color: #bbb; flex-shrink: 0;
    }
    .work-title {
      font-family: var(--font); font-weight: 800;
      font-size: clamp(0.82rem,1vw,0.96rem);
      letter-spacing: 0.06em; text-transform: uppercase; color: #111;
    }

    /* ── WATERMARK ── */
    .watermark {
      font-family: var(--font); font-weight: 800;
      font-size: calc(100vw / 5.5); letter-spacing: -0.01em;
      text-transform: uppercase; color: #efefef;
      user-select: none; pointer-events: none; line-height: 1;
      margin-left: calc(-50vw + 50%); width: 100vw; display: block;
    }
    .copyright {
      text-align: center; padding: 18px 0 40px;
      font-family: 'Open Sans', sans-serif; font-size: 0.7rem; color: #ccc; letter-spacing: 0.04em;
    }

    /* ── POPUP ── */
    #popup-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px;
    }
    #popup-overlay.open { opacity: 1; pointer-events: all; }

    .popup {
      background: #fff; width: 100%; max-width: 900px;
      max-height: 90vh; overflow-y: auto; position: relative; padding: 48px 48px 40px;
    }
    .popup-close {
      position: absolute; top: 20px; right: 24px; background: none; border: none;
      font-family: var(--font); font-weight: 800; font-size: 1.1rem;
      letter-spacing: 0.1em; cursor: pointer; color: #111; text-transform: uppercase;
    }
    .popup-close:hover { opacity: 0.4; }
    .popup-num { font-family: var(--font); font-weight: 800; font-size: 0.75rem; letter-spacing: 0.1em; color: #bbb; margin-bottom: 6px; }
    .popup-title { font-family: var(--font); font-weight: 800; font-size: clamp(1.4rem,3vw,2.2rem); letter-spacing: 0.06em; text-transform: uppercase; color: #111; margin-bottom: 6px; }
    .popup-category { font-family: var(--font); font-weight: 800; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: #aaa; margin-bottom: 40px; }

    /* ── POPUP BODY — alternating text / image rows ── */
    .popup-body { display: flex; flex-direction: column; gap: 56px; margin-bottom: 40px; }

    .popup-block {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 44px; align-items: center;
    }
    .popup-block.no-text { grid-template-columns: 1fr; }

    .popup-block-text {
      font-family: 'Open Sans', sans-serif; font-size: 0.92rem;
      line-height: 1.85; color: #555;
    }

    .popup-block-media { width: 100%; }

    .popup-full-media { width: 100%; }
    .popup-full-media .media-item { aspect-ratio: 16/9; }

    .media-item { background: #e8e8e8; overflow: hidden; width: 100%; position: relative; }
    .media-item img, .media-item video, .media-item iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center; display: block;
    }
    .media-item.portrait  { aspect-ratio: 3/4; }
    .media-item.landscape { aspect-ratio: 16/9; }
    .media-item.square    { aspect-ratio: 1/1; }
    .media-item.video-vertical { aspect-ratio: 9/16; }

    /* ── ADAPTIVE GALLERY ROWS (unlimited images) ──
       Landscape items render full-width via .popup-full-media (existing).
       Portrait / square / video items are grouped into rows of up to 3. */
    .popup-gallery-row { display: grid; gap: 44px; align-items: start; }
    .popup-gallery-row.cols-1 { grid-template-columns: 1fr; }
    .popup-gallery-row.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .popup-gallery-row.cols-3 { grid-template-columns: repeat(3, 1fr); }

    /* ── YOUTUBE FACADE (click-to-load, avoids loading iframes upfront) ── */
    .media-item .yt-facade { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; background: #111; }
    .yt-play {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.92);
      border: none; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.15s ease, background 0.15s ease;
    }
    .yt-play svg { width: 20px; height: 20px; fill: #111; margin-left: 2px; }
    .yt-facade:hover .yt-play { transform: translate(-50%,-50%) scale(1.08); background: #fff; }

    /* ── POPUP FOOTER — project info ── */
    .popup-footer {
      border-top: 1px solid #e8e8e8; padding-top: 24px; margin-top: 8px;
      display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 24px;
    }
    .popup-footer-label { font-family: var(--font); font-weight: 800; font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: #bbb; margin-bottom: 5px; }
    .popup-date { font-family: var(--font); font-weight: 800; font-size: 0.92rem; letter-spacing: 0.06em; color: #111; }
    .popup-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .popup-link {
      font-family: var(--font); font-weight: 800; font-size: 0.68rem;
      letter-spacing: 0.1em; text-transform: uppercase; color: #111; text-decoration: none;
      border: 1px solid #ddd; padding: 5px 12px;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .popup-link:hover { background: #111; color: #fff; border-color: #111; }
    .popup-link svg { width: 11px; height: 11px; fill: currentColor; flex-shrink: 0; }
    .popup-socials-block { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .popup-socials { display: flex; gap: 14px; align-items: center; }
    .popup-social { display: flex; align-items: center; color: #bbb; transition: color 0.15s; }
    .popup-social:hover { color: #111; }
    .popup-social svg { width: 16px; height: 16px; fill: currentColor; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) { .work-grid { grid-template-columns: repeat(2,1fr); gap: 24px 20px; } }
    @media (max-width: 768px) {
      .page { padding: 40px 20px 0; }
      .work-grid { grid-template-columns: repeat(2,1fr); gap: 18px 14px; }
      .watermark { font-size: calc(100vw / 4.2); }
      .popup { padding: 36px 20px 28px; }
      .popup-body { gap: 36px; margin-bottom: 32px; }
      .popup-block { grid-template-columns: 1fr; gap: 18px; }
      .popup-footer { grid-template-columns: 1fr; gap: 20px; }
      .popup-socials-block { align-items: flex-start; }
      .popup-gallery-row { gap: 14px; }
      .popup-gallery-row.cols-3 { grid-template-columns: repeat(2, 1fr); }
      .yt-play { width: 42px; height: 42px; }
      .yt-play svg { width: 16px; height: 16px; }
    }
    @media (max-width: 480px) { .work-grid { grid-template-columns: 1fr; } }
  </style>
</head>

    facebook:  '<svg viewBox="0 0 24 24"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.884v2.25h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>',
    behance:   '<svg viewBox="0 0 24 24"><path d="M6.938 4.503c.702 0 1.34.06 1.92.188.577.13 1.07.33 1.485.61.41.28.733.65.96 1.12.225.47.34 1.05.34 1.73 0 .74-.17 1.36-.507 1.86-.338.5-.837.9-1.502 1.22.906.26 1.576.72 2.022 1.37.448.66.665 1.45.665 2.36 0 .75-.13 1.39-.41 1.93-.28.55-.67 1-1.155 1.36-.486.37-1.055.64-1.71.8-.657.17-1.36.25-2.11.25H0V4.51h6.938v-.007zM16.94 4.5h6.54v1.56H16.94V4.5zm-10.1 4.5H3.5v3.03h3.34c.49 0 .893-.1 1.216-.3.32-.2.48-.54.48-1.01 0-.52-.16-.87-.48-1.06-.32-.2-.72-.29-1.216-.29V9zM16.96 8.33c-.92 0-1.64.25-2.17.73-.52.49-.82 1.16-.9 2.01h5.82c-.07-.87-.36-1.54-.89-2.02-.52-.47-1.18-.72-1.86-.72zM3.5 14.66h3.84c.55 0 1.02-.12 1.37-.36.36-.24.54-.64.54-1.2 0-.3-.06-.55-.18-.75-.11-.2-.27-.36-.47-.48-.2-.12-.43-.2-.69-.25-.26-.04-.53-.07-.82-.07H3.5v3.11zm13.5.5c.87 0 1.59-.24 2.13-.7.54-.47.86-1.15.97-2.07H17c.07.87.32 1.53.78 1.97.45.44 1.02.66 1.72.66V15.16h-.5z"/></svg>',

    tiktok:    '<svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>'
  };

  // ── RENDER GRID ──
  var grid = document.getElementById('work-grid');
  projects.forEach(function(p, i) {
    var item = document.createElement('div');
    item.className = 'work-item';
    item.setAttribute('data-category', p.category);
    item.setAttribute('data-index', i);

    var thumbInner = p.thumb
      ? '<img src="' + p.thumb + '" alt="' + p.title + '" />'
      : '';

    item.innerHTML =
      '<div class="work-thumb">' + thumbInner + '</div>' +
      '<div class="work-meta">' +
        '<span class="work-num">' + p.num + '</span>' +
        '<span class="work-title">' + p.title + '</span>' +
      '</div>';

    grid.appendChild(item);
  });

  // ── LOADER ──
  setTimeout(function() {
    document.getElementById('loader').classList.add('hidden');
  }, 800);

  // ── FILTER ──
  var filterBtns = document.querySelectorAll('.filter-btn');

  filterBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      filterBtns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var filter = btn.getAttribute('data-filter');
      var counter = 1;
      document.querySelectorAll('.work-item').forEach(function(item) {
        var cat = item.getAttribute('data-category');
        if (filter === 'all' || cat === filter) {
          item.classList.remove('hidden');
          item.querySelector('.work-num').textContent = String(counter).padStart(2, '0');
          counter++;
        } else {
          item.classList.add('hidden');
        }
      });
    });
  });

  // ── POPUP ──
  var overlay          = document.getElementById('popup-overlay');
  var popupBody         = document.getElementById('popup-body');
  var popupLinksWrap    = document.getElementById('popup-links-wrap');
  var popupSocialsWrap  = document.getElementById('popup-socials-wrap');

  // Vraća orijentaciju media unosa: 'orientation' je preferirano polje,
  // 'ratio' ostaje podržan zbog postojećih podataka.
  // Video: ako nije zadana orijentacija, pretpostavlja se 'portrait'
  // (Shorts, 9:16) — za horizontalne videe dodajte orientation: 'landscape'.
  function getOrientation(m, fallback) {
    if (!m) return fallback || 'landscape';
    if (m.type === 'video') return m.orientation || 'portrait';
    return m.orientation || m.ratio || fallback || 'landscape';
  }

  // Izvlači YouTube video ID iz pune Shorts/watch/embed URL-a ili iz golog ID-a
  function extractYoutubeId(input) {
    if (!input) return '';
    var s = String(input).trim();
    var match = s.match(/(?:shorts\/|watch\?v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{6,})/);
    if (match) return match[1];
    return s.replace(/^\/+|\/+$/g, '');
  }

  // Klik-za-pokretanje YouTube facade — prikazuje thumbnail + play gumb,
  // pravi iframe učitava tek na klik radi bolje performanse popupa.
  function buildYoutubeFacade(m, altText) {
    var id = extractYoutubeId(m.youtube || m.src);
    var facade = document.createElement('div');
    facade.className = 'yt-facade';

    var thumb = document.createElement('img');
    thumb.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
    thumb.alt = altText || '';
    thumb.loading = 'lazy';
    facade.appendChild(thumb);

    var playBtn = document.createElement('button');
    playBtn.type = 'button';
    playBtn.className = 'yt-play';
    playBtn.setAttribute('aria-label', 'Play video');
    playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    facade.appendChild(playBtn);

    facade.addEventListener('click', function loadVideo() {
      var iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1';
      iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
      iframe.setAttribute('allowfullscreen', '');
      iframe.loading = 'lazy';
      iframe.title = altText || 'YouTube video';
      facade.innerHTML = '';
      facade.appendChild(iframe);
      facade.removeEventListener('click', loadVideo);
    });

    return facade;
  }

  // Kreira jedan media-item element (sliku/video ili sivi placeholder)
  function buildMediaItem(m, fallbackRatio, altText) {
    var div = document.createElement('div');

    if (m && m.type === 'video') {
      var videoOrient = m.orientation || 'portrait';
      var videoClass = videoOrient === 'landscape' ? 'landscape' : 'video-vertical';
      div.className = 'media-item ' + videoClass;
      div.appendChild(buildYoutubeFacade(m, altText));
      return div;
    }

    var ratio = getOrientation(m, fallbackRatio);
    div.className = 'media-item ' + ratio;
    if (m && m.src) {
      var img = document.createElement('img');
      img.src = m.src; img.alt = altText || ''; img.loading = 'lazy';
      div.appendChild(img);
    }
    return div;
  }

  // Slaže NEOGRANIČEN niz media unosa u adaptivnu galeriju:
  // landscape → puna širina, portrait/square/video → grupirani do 3 po redu.
  function renderAdaptiveGallery(items, container, altText) {
    var i = 0;
    while (i < items.length) {
      var orient = getOrientation(items[i]);

      if (orient === 'landscape') {
        var fullRow = document.createElement('div');
        fullRow.className = 'popup-full-media';
        fullRow.appendChild(buildMediaItem(items[i], 'landscape', altText));
        container.appendChild(fullRow);
        i++;
        continue;
      }

      var bucket = [];
      while (i < items.length && bucket.length < 3 && getOrientation(items[i]) !== 'landscape') {
        bucket.push(items[i]);
        i++;
      }
      var galleryRow = document.createElement('div');
      galleryRow.className = 'popup-gallery-row cols-' + bucket.length;
      bucket.forEach(function(bm) {
        galleryRow.appendChild(buildMediaItem(bm, 'portrait', altText));
      });
      container.appendChild(galleryRow);
    }
  }

  // Dijeli opis na dva dijela (za dva teksualna bloka pored slika)
  function splitDesc(desc) {
    var sentences = (desc || '').match(/[^.!?]+[.!?]*/g);
    sentences = sentences ? sentences.map(function(s){ return s.trim(); }).filter(Boolean) : [];
    if (sentences.length <= 1) return [desc || '', ''];
    var mid = Math.ceil(sentences.length / 2);
    return [
      sentences.slice(0, mid).join(' ').trim(),
      sentences.slice(mid).join(' ').trim()
    ];
  }

  function openPopup(index) {
    var p = projects[index];
    document.getElementById('popup-num').textContent      = p.num;
    document.getElementById('popup-title').textContent    = p.title;
    document.getElementById('popup-category').textContent = p.category.replace('brand','Brand & Identity').replace('content','Content & Marketing').replace('film','Film & Documentary').replace('web','Web & Digital');
    document.getElementById('popup-date').textContent     = p.date || '—';

    // Links
    var linksEl = document.getElementById('popup-links');
    linksEl.innerHTML = '';
    if (p.links && p.links.length) {
      p.links.forEach(function(lnk) {
        var a = document.createElement('a');
        a.href = lnk.url; a.className = 'popup-link';
        a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.innerHTML = '<svg viewBox="0 0 24 24" style="width:10px;height:10px;fill:currentColor;stroke:none"><path d="M5 12h14M12 5l7 7-7 7"/></svg>' + lnk.label;
        linksEl.appendChild(a);
      });
      popupLinksWrap.style.display = '';
    } else {
      popupLinksWrap.style.display = 'none';
    }

    // Socials
    var socialsEl = document.getElementById('popup-socials');
    socialsEl.innerHTML = '';
    if (p.socials && p.socials.length) {
      p.socials.forEach(function(s) {
        var a = document.createElement('a');
        a.href = s.url; a.className = 'popup-social';
        a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.setAttribute('aria-label', s.type);
        a.innerHTML = ICONS[s.type] || '';
        socialsEl.appendChild(a);
      });
      popupSocialsWrap.style.display = '';
    } else {
      popupSocialsWrap.style.display = 'none';
    }

    // ── BODY: tekst/slika naizmjenično + jedna landscape slika ──
    // media[0] je cover (ista slika kao thumbnail) — namjerno se preskače
    // kako se ne bi ponavljala unutar popup galerije.
    popupBody.innerHTML = '';
    var gallery = (p.media || []).slice(1);
    var img1 = gallery[0];
    var img2 = gallery[1];
    var rest = gallery.slice(2); // NEOGRANIČENO — sve ostalo ide u adaptivnu galeriju
    var parts = splitDesc(p.desc);

    // Red A — tekst lijevo / slika desno
    if (parts[0] || img1) {
      var rowA = document.createElement('div');
      rowA.className = 'popup-block' + (parts[0] ? '' : ' no-text');
      if (parts[0]) {
        var textA = document.createElement('div');
        textA.className = 'popup-block-text';
        textA.textContent = parts[0];
        rowA.appendChild(textA);
      }
      var mediaWrapA = document.createElement('div');
      mediaWrapA.className = 'popup-block-media';
      mediaWrapA.appendChild(buildMediaItem(img1, 'square', p.title));
      rowA.appendChild(mediaWrapA);
      popupBody.appendChild(rowA);
    }

    // Red B — slika lijevo / tekst desno (zrcaljeno)
    if (parts[1] || img2) {
      var rowB = document.createElement('div');
      rowB.className = 'popup-block' + (parts[1] ? '' : ' no-text');
      var mediaWrapB = document.createElement('div');
      mediaWrapB.className = 'popup-block-media';
      mediaWrapB.appendChild(buildMediaItem(img2, 'square', p.title));
      rowB.appendChild(mediaWrapB);
      if (parts[1]) {
        var textB = document.createElement('div');
        textB.className = 'popup-block-text';
        textB.textContent = parts[1];
        rowB.appendChild(textB);
      }
      popupBody.appendChild(rowB);
    }

    // Adaptivna galerija — svi preostali unosi (neograničeno), grupirani
    // prema orijentaciji: landscape puna širina, portrait/square/video do 3 po redu
    if (rest.length) {
      renderAdaptiveGallery(rest, popupBody, p.title);
    }

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closePopup() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    popupBody.querySelectorAll('video').forEach(function(v){ v.pause(); });
  }

  // Click on grid items — delegated since grid is dynamic
  grid.addEventListener('click', function(e) {
    var item = e.target.closest('.work-item');
    if (item) openPopup(parseInt(item.getAttribute('data-index')));
  });

  document.getElementById('popup-close').addEventListener('click', closePopup);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closePopup(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePopup(); });

  </script>
</body>
